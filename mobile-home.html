  命名约定：所有 CSS 类 / HTML id / JS 变量函数 均以 lyh_ 开头

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>课堂成果 · 统一入口</title>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      color: #fff;
    }

    /* lyh_顶部标题区 */
    .lyh-header { text-align: center; padding: 30px 20px 16px; }
    .lyh-header h1 { font-size: 22px; margin: 0 0 6px; }
    .lyh-header p { margin: 0; font-size: 13px; opacity: .85; }

    /* lyh_视频区标题 */
    .lyh-sec-title {
      padding: 10px 20px 8px; font-size: 13px; font-weight: 700;
      opacity: .95; letter-spacing: 1px; text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
    }
    .lyh-sec-title::before {
      content: ''; display: inline-block; width: 4px; height: 14px;
      background: #fff; border-radius: 2px;
    }

    /* lyh_视频容器：16:9 */
    .lyh-video-wrap {
      position: relative;
      margin: 0 16px 20px;
      padding-bottom: 56.25%; /* 16:9 */
      background: #000; border-radius: 14px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    .lyh-video-wrap video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: contain;
      background: #000;
    }

    /* lyh_卡片列表 */
    .lyh-list { padding: 0 16px 40px; display: flex; flex-direction: column; gap: 14px; }

    /* lyh_单个卡片 */
    .lyh-card {
      display: block; text-decoration: none; color: #fff;
      background: rgba(255,255,255,.18); backdrop-filter: blur(10px);
      border-radius: 18px; padding: 20px 18px;
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
      transition: transform .2s;
    }
    .lyh-card:active { transform: scale(.97); }

    .lyh-card-top {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
    }
    .lyh-card-num {
      font-size: 11px; font-weight: 700;
      background: rgba(255,255,255,.3); padding: 3px 10px; border-radius: 10px;
      letter-spacing: 1px;
    }
    .lyh-card-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .lyh-card-desc { font-size: 12px; opacity: .85; line-height: 1.5; }
    .lyh-card-arrow {
      float: right; font-size: 16px; opacity: .8; margin-top: -22px;
    }

    /* lyh_三种主题色 */
    .lyh-card.gesture { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border-color: rgba(255,255,255,.3); }
    .lyh-card.zoom    { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border-color: rgba(255,255,255,.3); }
    .lyh-card.shake   { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); border-color: rgba(255,255,255,.3); }

    .lyh-footer { text-align: center; padding: 10px 20px 30px; font-size: 11px; opacity: .6; }
  </style>
</head>
<body>

  <div class="lyh-header">
    <h1>🎬 课堂成果 · 统一入口</h1>
    <p>一个链接 · 视频 + 三大移动端任务</p>
  </div>

  <!-- lyh_视频区 -->
  <div class="lyh-sec-title">课堂演示视频</div>
  <div class="lyh-video-wrap">
    <video controls autoplay muted loop playsinline preload="metadata">
      <source src="video.mp4" type="video/mp4" />
      您的浏览器不支持 video 标签
    </video>
  </div>

  <!-- lyh_三大任务卡片区 -->
  <div class="lyh-sec-title">移动端交互任务</div>
  <div class="lyh-list">

    <!-- 任务二：手势卡片 -->
    <a class="lyh-card gesture" href="mobile-gesture.html">
      <div class="lyh-card-top">
        <span class="lyh-card-num">任务二 ★★</span>
      </div>
      <div class="lyh-card-title">🍜 中华美食卡片</div>
      <div class="lyh-card-desc">左右滑动 4 道中华美食 · 阈值 60px · 300ms 冷却 · 边界提示</div>
      <span class="lyh-card-arrow">→</span>
    </a>

    <!-- 任务三：图片查看器 -->
    <a class="lyh-card zoom" href="mobile-zoom.html">
      <div class="lyh-card-top">
        <span class="lyh-card-num">任务三 ★★★</span>
      </div>
      <div class="lyh-card-title">🦆 美食图片查看器</div>
      <div class="lyh-card-desc">双指 1~4x 缩放（两指中点不跳）· 双击 1x↔2x · 双指旋转 · 状态持久化</div>
      <span class="lyh-card-arrow">→</span>
    </a>

    <!-- 任务四：摇一摇彩蛋 -->
    <a class="lyh-card shake" href="mobile-sensor.html">
      <div class="lyh-card-top">
        <span class="lyh-card-num">任务四 ★★★</span>
      </div>
      <div class="lyh-card-title">🎰 摇一摇抽菜谱</div>
      <div class="lyh-card-desc">devicemotion 加速度传感器 · 阈值 18 · 冷却 1.5s · iOS 权限 · 降级按钮</div>
      <span class="lyh-card-arrow">→</span>
    </a>

  </div>

  <div class="lyh-footer">林奕含 · 24002120622</div>

</body>
</html>
