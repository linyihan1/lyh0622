<!--
  lyh_mobile-gesture.html — 任务二·手势卡片：左右滑动切换内容
  作者：林奕含  学号：24002120622
  时间：2026-11-18  模型：Trae
  功能：中华美食卡片 4 道菜，touch 手势左右滑动切换，60px 阈值 + 300ms 冷却 + 边界提示
  命名约定：所有 CSS 类 / HTML id / JS 变量函数 均以 lyh_ 开头
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>任务二 · 手势卡片 | 中华美食</title>
  <style>
    * { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
      overflow: hidden;
    }

    .lyh-header { text-align: center; padding: 18px 16px 6px; }
    .lyh-header h1 { font-size: 22px; margin: 0; color: #7a3b1e; text-shadow: 0 1px 2px rgba(255,255,255,.6); }
    .lyh-header p { margin: 4px 0 0; font-size: 13px; color: #a0522d; }

    /* lyh_卡片舞台：固定高度 overflow hidden + touch-action:pan-y 保证纵向可滚 */
    .lyh-stage {
      position: relative; margin: 14px auto;
      width: 92vw; max-width: 420px;
      height: 58vh; min-height: 360px;
      overflow: hidden;
      touch-action: pan-y;
    }

    /* lyh_单张卡片：绝对定位叠在一起，left:0 全叠一起 */
    .lyh-card {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,.25);
      background: #fff;
      transition: transform .3s cubic-bezier(.25,.8,.25,1), opacity .3s;
      will-change: transform, opacity;
    }
    .lyh-card img { width: 100%; height: 52%; object-fit: cover; display: block; }
    .lyh-card-body { padding: 14px 16px 18px; }
    .lyh-card-body h2 { margin: 0 0 4px; font-size: 20px; color: #333; }
    .lyh-card-body .lyh-tag {
      display: inline-block; font-size: 11px;
      background: #ff6b35; color: #fff;
      padding: 2px 8px; border-radius: 10px; margin-bottom: 6px;
    }
    .lyh-card-body p { margin: 0; font-size: 14px; color: #555; line-height: 1.6; }

    .lyh-hint {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,.55); color: #fff;
      padding: 10px 20px; border-radius: 20px;
      font-size: 14px; opacity: 0; pointer-events: none;
      transition: opacity .25s; z-index: 50;
    }
    .lyh-hint.show { opacity: 1; }

    .lyh-counter { text-align: center; font-size: 13px; color: #7a3b1e; padding: 4px 0 12px; font-weight: 600; }
    .lyh-tip { text-align: center; font-size: 12px; color: #a0522d; position: fixed; bottom: 12px; width: 100%; }
  </style>
</head>
<body>

  <div class="lyh-header">
    <h1>🍜 中华美食卡片</h1>
    <p>← 左滑看下一道　右滑看上一道 →</p>
  </div>

  <div class="lyh-stage" id="lyh_stage">
    <div class="lyh-hint" id="lyh_hint">已经是第一张啦</div>

    <!-- lyh_4 张美食卡片（用已有图片做视觉，不联网也能跑） -->
    <div class="lyh-card" data-lyh-index="0">
      <img src="mobile-imgs/beijing_duck.jpg" alt="北京烤鸭" />
      <div class="lyh-card-body">
        <span class="lyh-tag">京菜 · 招牌</span>
        <h2>北京烤鸭</h2>
        <p>皮脆肉嫩，肥而不腻。蘸甜面酱、卷荷叶饼，老北京国宴级大菜。</p>
      </div>
    </div>

    <div class="lyh-card" data-lyh-index="1">
      <img src="mobile-imgs/mapo_tofu.jpg" alt="麻婆豆腐" />
      <div class="lyh-card-body">
        <span class="lyh-tag">川菜 · 经典</span>
        <h2>麻婆豆腐</h2>
        <p>麻辣鲜香，嫩滑入味。一勺花椒一勺豆瓣酱，平凡豆腐炒出江湖气。</p>
      </div>
    </div>

    <div class="lyh-card" data-lyh-index="2">
      <img src="mobile-imgs/steamed_bass.jpg" alt="清蒸鲈鱼" />
      <div class="lyh-card-body">
        <span class="lyh-tag">粤菜 · 鲜品</span>
        <h2>清蒸鲈鱼</h2>
        <p>火候精准到秒，肉质细嫩如凝脂。淋上蒸鱼豉油，一滴鲜过一滴。</p>
      </div>
    </div>

    <div class="lyh-card" data-lyh-index="3">
      <img src="mobile-imgs/dongpo_pork.jpg" alt="东坡肉" />
      <div class="lyh-card-body">
        <span class="lyh-tag">浙菜 · 人文</span>
        <h2>东坡肉</h2>
        <p>慢炖三时，入口即化。苏东坡贬黄州时的发明，肥瘦相间，甜咸适中。</p>
      </div>
    </div>
  </div>

  <div class="lyh-counter" id="lyh_counter">第 1 / 4 张</div>
  <div class="lyh-tip">📱 在手机上打开体验最佳</div>

<script>
  // ══════════════════════════════════════════════════════════
  //  lyh_手势卡片核心逻辑
  //  1) touchstart 记录起点
  //  2) touchend 计算位移 → 阈值 60px 内不切换（防短距离误触）
  //  3) 切换成功后 300ms 冷却锁（防快速连滑）
  //  4) 到边界显示提示文字
  //  ══════════════════════════════════════════════════════════

  var lyh_stage = document.getElementById('lyh_stage');
  var lyh_cards = lyh_stage.querySelectorAll('.lyh-card');
  var lyh_counter = document.getElementById('lyh_counter');
  var lyh_hint = document.getElementById('lyh_hint');

  var lyh_index = 0;
  var lyh_total = lyh_cards.length;
  var lyh_startX = 0;
  var lyh_cooling = false;
  var LYH_THRESHOLD = 60;     // lyh_阈值：60px
  var LYH_COOLDOWN = 300;     // lyh_冷却：300ms

  // lyh_初始布局：当前索引 card 位置 0，其余 -100% / +100%
  function lyh_layout() {
    for (var i = 0; i < lyh_total; i++) {
      var c = lyh_cards[i];
      c.style.transition = 'none';
      if (i === lyh_index) {
        c.style.transform = 'translateX(0)';
        c.style.opacity = '1';
        c.style.zIndex = '10';
      } else if (i < lyh_index) {
        c.style.transform = 'translateX(-100%)';
        c.style.opacity = '0';
        c.style.zIndex = '1';
      } else {
        c.style.transform = 'translateX(100%)';
        c.style.opacity = '0';
        c.style.zIndex = '1';
      }
    }
    lyh_stage.offsetHeight;  // lyh_强制 reflow
    for (var j = 0; j < lyh_total; j++) lyh_cards[j].style.transition = '';
    lyh_counter.textContent = '第 ' + (lyh_index + 1) + ' / ' + lyh_total + ' 张';
  }
  lyh_layout();

  // lyh_touchstart: 记录起点
  lyh_stage.addEventListener('touchstart', function (e) {
    if (lyh_cooling) return;
    lyh_startX = e.changedTouches[0].clientX;
    lyh_hint.classList.remove('show');
  }, { passive: true });

  // lyh_touchend: 计算位移
  lyh_stage.addEventListener('touchend', function (e) {
    if (lyh_cooling) return;
    var dx = e.changedTouches[0].clientX - lyh_startX;

    if (Math.abs(dx) < LYH_THRESHOLD) return;  // lyh_阈值内忽略

    if (dx < 0) {
      // lyh_左滑 → 下一张
      if (lyh_index >= lyh_total - 1) { lyh_showHint('已经是最后一张啦'); return; }
      lyh_index++; lyh_layout();
    } else {
      // lyh_右滑 → 上一张
      if (lyh_index <= 0) { lyh_showHint('已经是第一张啦'); return; }
      lyh_index--; lyh_layout();
    }

    // lyh_冷却锁
    lyh_cooling = true;
    setTimeout(function () { lyh_cooling = false; }, LYH_COOLDOWN);
  }, { passive: true });

  function lyh_showHint(text) {
    lyh_hint.textContent = text;
    lyh_hint.classList.add('show');
    setTimeout(function () { lyh_hint.classList.remove('show'); }, 1500);
  }
</script>
</body>
</html>
