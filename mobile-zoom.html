<!--
  lyh_mobile-zoom.html — 任务三·图片查看器：双指缩放 + 双击放大 + 拖动
  作者：林奕含  学号：24002120622
  时间：2026-11-18  模型：Trae
  功能：单指拖动 / 双指 1x~4x 缩放（以两指中点为基准）/ 双击 1x↔2x / 缩回 1x 自动居中 / 边界限制
  命名约定：所有 CSS 类 / HTML id / JS 变量函数 均以 lyh_ 开头
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>任务三 · 图片查看器 | 双指缩放 + 双击放大</title>
  <style>
    * { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #eee;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }

    /* lyh_顶部：缩放比例实时显示 */
    .lyh-topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(0,0,0,.6); backdrop-filter: blur(8px);
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
      font-size: 14px;
    }
    .lyh-topbar .lyh-title { font-weight: 600; font-size: 15px; }
    .lyh-topbar .lyh-scale-text {
      background: rgba(255,255,255,.15); padding: 3px 10px; border-radius: 12px; font-weight: 600;
    }

    /* lyh_核心容器：overflow:hidden + touch-action:none + user-select:none */
    .lyh-viewer {
      position: relative; width: 100vw; height: 100vh;
      overflow: hidden; touch-action: none; user-select: none; background: #000;
    }

    /* lyh_图片：用 transform 做平移缩放，transform-origin:0 0 方便计算 */
    .lyh-image {
      position: absolute; top: 50%; left: 50%;
      max-width: 100%; max-height: 100%;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
    }

    .lyh-hint-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(0,0,0,.7); padding: 10px 16px;
      font-size: 12px; color: #bbb; text-align: center; line-height: 1.7;
    }
    .lyh-hint-bar code {
      background: rgba(255,255,255,.12); padding: 1px 6px; border-radius: 8px; color: #fff;
    }
  </style>
</head>
<body>

  <div class="lyh-topbar">
    <span class="lyh-title">🔍 双指缩放查看器</span>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="lyh-scale-text" id="lyh_scaleText">1.0x</span>
      <span class="lyh-scale-text" id="lyh_rotText" title="旋转角度">0°</span>
    </div>
  </div>

  <div class="lyh-viewer" id="lyh_viewer">
    <img class="lyh-image" id="lyh_img"
         src="swiper-imgs/aida_modu.jpg"
         alt="爱达·魔都号 · 双击放大 / 双指缩放 1~4x" />
  </div>

  <div class="lyh-hint-bar">
    单指拖动 · <code>双指缩放</code> · <code>双击 1x↔2x</code> · 缩回 1x 自动居中
  </div>

<script>
  // ══════════════════════════════════════════════════════════
  //  lyh_图片查看器核心逻辑
  //  技术要点：
  //    1) 图片 transform-origin:0 0 → transform:translate(x,y) scale(s)
  //    2) 缩放以两指中点为基准 → 锚点屏幕坐标不变 → 视觉"不跳"
  //    3) 松手边界限制 → 1x 时居中；放大后不超出图片边缘
  //    4) 双击 1x ↔ 2x 带 0.25s 过渡
  // ══════════════════════════════════════════════════════════

  var lyh_viewer = document.getElementById('lyh_viewer');
  var lyh_img = document.getElementById('lyh_img');
  var lyh_scaleText = document.getElementById('lyh_scaleText');

  // lyh_核心状态（rot 旋转角度 单位度，加分项）
  var lyh_state = { scale: 1, tx: 0, ty: 0, rot: 0, width: 0, height: 0 };
  var LYH_MIN = 1, LYH_MAX = 4, LYH_ROT_MAX = 45;

  // lyh_交互临时变量
  var lyh_mode = 'none';
  var lyh_lastDist = 0, lyh_startDist = 0;
  var lyh_startPinchScale = 1;
  var lyh_startMidX = 0, lyh_startMidY = 0;
  var lyh_startAngle = 0;           // lyh_加分项：双指旋转初始角度
  var lyh_startPinchRot = 0;        // lyh_加分项：双指旋转起始 state.rot
  var lyh_lastTouchX = 0, lyh_lastTouchY = 0;
  var lyh_lastTapTime = 0;
  var LYH_STORAGE_KEY = 'lyh_zoom_state_v1';  // lyh_验收④：状态持久化 key

  // lyh_初始化
  lyh_img.addEventListener('load', lyh_init);
  if (lyh_img.complete) lyh_init();

  function lyh_init() {
    var vw = lyh_viewer.clientWidth, vh = lyh_viewer.clientHeight;
    var ratio = Math.min(vw / lyh_img.naturalWidth, vh / lyh_img.naturalHeight);
    lyh_img.style.width = (lyh_img.naturalWidth * ratio) + 'px';
    lyh_img.style.height = (lyh_img.naturalHeight * ratio) + 'px';
    lyh_state.width = lyh_img.clientWidth;
    lyh_state.height = lyh_img.clientHeight;
    // lyh_验收④：尝试从 localStorage 恢复之前的状态（旋转屏幕不丢失）
    lyh_restoreState();
    lyh_applyTransform();
  }

  // lyh_验收④：保存/恢复 — 旋转屏幕不丢失
  function lyh_saveState() {
    try {
      localStorage.setItem(LYH_STORAGE_KEY, JSON.stringify({
        scale: lyh_state.scale, tx: lyh_state.tx, ty: lyh_state.ty, rot: lyh_state.rot
      }));
    } catch (e) {}
  }
  function lyh_restoreState() {
    try {
      var raw = localStorage.getItem(LYH_STORAGE_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (s.scale >= LYH_MIN && s.scale <= LYH_MAX) lyh_state.scale = s.scale;
      if (typeof s.tx === 'number') lyh_state.tx = s.tx;
      if (typeof s.ty === 'number') lyh_state.ty = s.ty;
      if (typeof s.rot === 'number') lyh_state.rot = s.rot;
    } catch (e) {}
  }
  // lyh_beforeunload / visibilitychange 时保存
  window.addEventListener('beforeunload', lyh_saveState);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') lyh_saveState();
  });

  // lyh_把 state 渲染到 transform（加分项：加入 rotate）
  function lyh_applyTransform() {
    var w = lyh_state.width * lyh_state.scale;
    var h = lyh_state.height * lyh_state.scale;
    var vw = lyh_viewer.clientWidth, vh = lyh_viewer.clientHeight;
    var baseX = (vw - w) / 2, baseY = (vh - h) / 2;
    var fx = baseX + lyh_state.tx, fy = baseY + lyh_state.ty;
    // lyh_transform 顺序：先 translate → 再 rotate → 再 scale
    lyh_img.style.transform =
      'translate(' + fx + 'px,' + fy + 'px)' +
      ' rotate(' + lyh_state.rot + 'deg)' +
      ' scale(' + lyh_state.scale + ')';
    lyh_scaleText.textContent = lyh_state.scale.toFixed(1) + 'x';
    // lyh_加分项：旋转指示器
    var rotEl = document.getElementById('lyh_rotText');
    if (rotEl) rotEl.textContent = Math.round(lyh_state.rot) + '°';
  }

  // lyh_边界限制：松手后
  function lyh_clamp() {
    var w = lyh_state.width * lyh_state.scale;
    var h = lyh_state.height * lyh_state.scale;
    var vw = lyh_viewer.clientWidth, vh = lyh_viewer.clientHeight;
    if (w <= vw) lyh_state.tx = 0;
    else { var m = (w - vw) / 2; lyh_state.tx = Math.max(-m, Math.min(m, lyh_state.tx)); }
    if (h <= vh) lyh_state.ty = 0;
    else { var n = (h - vh) / 2; lyh_state.ty = Math.max(-n, Math.min(n, lyh_state.ty)); }
    lyh_applyTransform();
  }

  // lyh_Touch 事件
  lyh_viewer.addEventListener('touchstart', onStart, { passive: false });
  lyh_viewer.addEventListener('touchmove',  onMove,  { passive: false });
  lyh_viewer.addEventListener('touchend',   onEnd,   { passive: false });
  lyh_viewer.addEventListener('touchcancel', onEnd,  { passive: false });

  function onStart(e) {
    e.preventDefault();
    var t = e.touches;
    if (t.length === 1) {
      lyh_mode = 'drag';
      lyh_lastTouchX = t[0].clientX; lyh_lastTouchY = t[0].clientY;
      // lyh_双击检测
      var now = Date.now();
      if (now - lyh_lastTapTime < 300) lyh_toggleDoubleTap();
      lyh_lastTapTime = now;
    } else if (t.length === 2) {
      lyh_mode = 'pinch';
      lyh_startDist = getDist(t[0], t[1]);
      lyh_startPinchScale = lyh_state.scale;
      lyh_startMidX = (t[0].clientX + t[1].clientX) / 2;
      lyh_startMidY = (t[0].clientY + t[1].clientY) / 2;
      // lyh_加分项：双指旋转 → 用 Math.atan2 算两指连线角度
      lyh_startAngle = Math.atan2(t[1].clientY - t[0].clientY, t[1].clientX - t[0].clientX);
      lyh_startPinchRot = lyh_state.rot;
    }
  }

  function onMove(e) {
    e.preventDefault();
    var t = e.touches;
    if (lyh_mode === 'drag' && t.length === 1) {
      lyh_state.tx += t[0].clientX - lyh_lastTouchX;
      lyh_state.ty += t[0].clientY - lyh_lastTouchY;
      lyh_lastTouchX = t[0].clientX; lyh_lastTouchY = t[0].clientY;
      lyh_applyTransform();
    } else if (lyh_mode === 'pinch' && t.length === 2) {
      var ratio = getDist(t[0], t[1]) / lyh_startDist;
      var newScale = Math.max(LYH_MIN, Math.min(LYH_MAX, lyh_startPinchScale * ratio));
      lyh_scaleAtPoint(newScale, lyh_startMidX, lyh_startMidY);
      // lyh_加分项：双指旋转 → Math.atan2 算当前角度，减初始角度得差值
      var curAngle = Math.atan2(t[1].clientY - t[0].clientY, t[1].clientX - t[0].clientX);
      var angleDiff = (curAngle - lyh_startAngle) * 180 / Math.PI;  // rad → deg
      lyh_state.rot = Math.max(-LYH_ROT_MAX, Math.min(LYH_ROT_MAX, lyh_startPinchRot + angleDiff));
      lyh_applyTransform();
    }
  }

  function onEnd(e) {
    e.preventDefault();
    if (lyh_mode === 'pinch' || (lyh_mode === 'drag' && lyh_state.scale > 1)) {
      lyh_clamp();
    } else if (lyh_mode === 'drag' && lyh_state.scale <= 1) {
      lyh_state.tx = 0; lyh_state.ty = 0;
      lyh_img.style.transition = 'transform .25s ease';
      lyh_applyTransform();
      setTimeout(function () { lyh_img.style.transition = ''; }, 260);
    }
    if (e.touches.length === 1) {
      lyh_mode = 'drag';
      lyh_lastTouchX = e.touches[0].clientX; lyh_lastTouchY = e.touches[0].clientY;
    } else lyh_mode = 'none';
  }

  function getDist(a, b) {
    var dx = a.clientX - b.clientX, dy = a.clientY - b.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // lyh_核心：以某点为基准缩放 → 保证"不跳"
  function lyh_scaleAtPoint(newScale, ax, ay) {
    var w = lyh_state.width, h = lyh_state.height;
    var vw = lyh_viewer.clientWidth, vh = lyh_viewer.clientHeight;
    var oldW = w * lyh_state.scale, oldH = h * lyh_state.scale;
    var oldBaseX = (vw - oldW) / 2, oldBaseY = (vh - oldH) / 2;
    // lyh_锚点在图片中的归一化位置
    var px = (ax - oldBaseX - lyh_state.tx) / oldW;
    var py = (ay - oldBaseY - lyh_state.ty) / oldH;
    lyh_state.scale = newScale;
    var newW = w * newScale, newH = h * newScale;
    var newBaseX = (vw - newW) / 2, newBaseY = (vh - newH) / 2;
    // lyh_反推 tx/ty：锚点屏幕坐标不变
    lyh_state.tx = ax - newBaseX - px * newW;
    lyh_state.ty = ay - newBaseY - py * newH;
    lyh_applyTransform();
  }

  function lyh_toggleDoubleTap() {
    lyh_img.style.transition = 'transform .25s ease';
    if (lyh_state.scale > 1.2) {
      lyh_state.scale = 1; lyh_state.tx = 0; lyh_state.ty = 0; lyh_state.rot = 0;
    } else {
      lyh_scaleAtPoint(2, lyh_viewer.clientWidth / 2, lyh_viewer.clientHeight / 2);
      lyh_clamp();
    }
    lyh_applyTransform();
    setTimeout(function () { lyh_img.style.transition = ''; }, 260);
  }

  // lyh_验收④：resize 时重新 layout，但保留 scale/tx/ty/rot（旋转屏幕后恢复状态）
  window.addEventListener('resize', function () {
    lyh_init();
    lyh_clamp();
  });
</script>
</body>
</html>
