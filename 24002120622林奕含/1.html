<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG图标</title>
 <script src="https://at.alicdn.com/t/c/font_5232859_2ayqab5otwm.js"></script>
 <link rel="stylesheet" href="./svg.css">


</head>
<body>
    <h3>SVG图标</h3>
    <div class="tab-nav">
        <div class="tab-item active" onclick="changeTab(this)">
          <svg class="icon" aria-hidden="true">
  <use xlink:href="#icon-dengpao"></use>
          </svg>
<span>灯泡</span>
        </div>
         <div class="tab-item">
          <svg class="icon" aria-hidden="true">
  <use xlink:href="#icon-men"></use>
</svg>
<span>门</span>
        </div>
         <div class="tab-item">
          <svg class="icon" aria-hidden="true">
  <use xlink:href="#icon-danlunche"></use>
</svg>
<span>单轮车</span>
        </div>
         <div class="tab-item">
          <svg class="icon" aria-hidden="true">
  <use xlink:href="#icon-zhifeiji"></use>
</svg>
<span>纸飞机</span>
        </div>
    </div>
        <script>
        // 写一个函数，当我点击当天的item时候，颜色发生变化
        function changeTab(current) {
            let tabs = document.querySelectorAll(".tab-item");
            for (let i= 0; i < tabs.length; i++) {
                tabs[i].classList.remove("active");
            }
            current.classList.add("active");
        }
    </script>
</body>
</html>
