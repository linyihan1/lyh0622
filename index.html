<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonts of the Trade — Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --lyh-ink: #0D0D0D;
  --lyh-slate: #1A1F2B;
  --lyh-bone: #EDE8DF;
  --lyh-ash: #7A7F8A;
  --lyh-brass: #C8A951;
  --lyh-sage: #6B8F71;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: var(--lyh-ink);
  color: var(--lyh-bone);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.lyh-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 120px 56px 80px;
}

.lyh-header {
  border-bottom: 1px solid rgba(122, 127, 138, 0.18);
  padding-bottom: 48px;
  margin-bottom: 80px;
}
.lyh-header-label {
  color: var(--lyh-brass);
  font-size: 0.82rem;
  letter-spacing: 0.18em;
  margin-bottom: 24px;
}
.lyh-header-title {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: clamp(3rem, 7vw, 5.5rem);
  line-height: 0.95;
  letter-spacing: -0.03em;
}
.lyh-header-title em {
  color: var(--lyh-brass);
  font-style: italic;
}
.lyh-header-sub {
  color: var(--lyh-ash);
  font-size: 1rem;
  margin-top: 28px;
  max-width: 520px;
  font-weight: 300;
  line-height: 1.75;
}

.lyh-list {
  list-style: none;
  display: flex;
  flex-direction: column;
}
.lyh-list-item {
  border-top: 1px solid rgba(122, 127, 138, 0.18);
  transition: background 0.25s;
}
.lyh-list-item:last-child { border-bottom: 1px solid rgba(122, 127, 138, 0.18); }
.lyh-list-item:hover { background: rgba(200, 169, 81, 0.03); }
.lyh-list-item:hover .lyh-list-arrow { transform: translateX(6px); color: var(--lyh-brass); }

.lyh-list-item a {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  align-items: center;
  gap: 32px;
  padding: 28px 0;
  text-decoration: none;
  color: inherit;
}
.lyh-list-num {
  font-family: 'Playfair Display', serif;
  color: var(--lyh-ash);
  font-size: 0.85rem;
  letter-spacing: 0.08em;
}
.lyh-list-info { display: flex; flex-direction: column; gap: 6px; }
.lyh-list-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--lyh-bone);
}
.lyh-list-desc {
  color: var(--lyh-ash);
  font-size: 0.88rem;
  font-weight: 300;
}
.lyh-list-arrow {
  color: var(--lyh-ash);
  font-size: 1.4rem;
  transition: transform 0.25s, color 0.25s;
}

.lyh-footer {
  margin-top: 120px;
  padding-top: 32px;
  border-top: 1px solid rgba(122, 127, 138, 0.18);
  color: var(--lyh-ash);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
}

@media (max-width: 700px) {
  .lyh-container { padding: 80px 24px 48px; }
  .lyh-list-item a { grid-template-columns: 50px 1fr auto; gap: 16px; padding: 20px 0; }
  .lyh-list-title { font-size: 1.15rem; }
}
</style>
</head>
<body>
<div class="lyh-container">

  <header class="lyh-header">
    <div class="lyh-header-label">INDEX · 2026</div>
    <h1 class="lyh-header-title">Fonts<em>.</em>of<br>the<em>.</em>Trade.</h1>
    <p class="lyh-header-sub">
      一个艺术品牌的图标字体实验室。下面是所有已发布页面 —— 
      每一个都经过手工雕琢，没有模板。
    </p>
  </header>

  <ul class="lyh-list">
    <li class="lyh-list-item">
      <a href="iconfont-1.html">
        <span class="lyh-list-num">01</span>
        <div class="lyh-list-info">
          <span class="lyh-list-title">Font Awesome</span>
          <span class="lyh-list-desc">字体图标方式 · CSS @font-face · Solid / Regular / Brands</span>
        </div>
        <span class="lyh-list-arrow">→</span>
      </a>
    </li>
    <li class="lyh-list-item">
      <a href="iconfont-2.html">
        <span class="lyh-list-num">02</span>
        <div class="lyh-list-info">
          <span class="lyh-list-title">Lucide</span>
          <span class="lyh-list-desc">SVG 图标方式 · 矢量可编辑 · 开源线条图标集</span>
        </div>
        <span class="lyh-list-arrow">→</span>
      </a>
    </li>
    <li class="lyh-list-item">
      <a href="四级.html">
        <span class="lyh-list-num">03</span>
        <div class="lyh-list-info">
          <span class="lyh-list-title">四级</span>
          <span class="lyh-list-desc">已有页面</span>
        </div>
        <span class="lyh-list-arrow">→</span>
      </a>
    </li>
  </ul>

  <footer class="lyh-footer">© 2026 FONTS OF THE TRADE</footer>

</div>
</body>
</html>
