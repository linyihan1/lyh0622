<!--
  lyh_mobile-sensor.html — 任务四·摇一摇彩蛋
  作者：林奕含  学号：24002120622
  时间：2026-11-18  模型：Trae
  功能：devicemotion → accelerationIncludingGravity 合成加速度 → 阈值触发摇一摇 → 弹出随机菜谱
        ✅ 验收①：冷却 1.5s，一次摇动只触发一次
        ✅ 验收②：无传感器 → 显示"当前设备不支持"，降级按钮
        ✅ 验收③：iOS 通过按钮申请权限
        ✅ 验收④：代码注释讲清两种 acceleration 的区别
  命名约定：所有 CSS 类 / HTML id / JS 变量函数 均以 lyh_ 开头
  为什么必须做降级？
    答：不同手机/浏览器对 DeviceMotion API 支持差异大。
    1) iOS 13+ 必须用户手动点按钮申请权限，否则 devicemotion 永远不触发；
    2) iOS 某些版本即使授权了，从桌面快捷方式打开的 PWA 也读不到传感器；
    3) Android 某些国产浏览器（微信内置浏览器、部分定制版 Chrome）可能禁用或屏蔽加速度传感器；
    4) 如果服务器是 HTTP 而非 HTTPS，iOS Safari 会**静默屏蔽** devicemotion 事件，页面不报任何错但数据永远是 null；
    5) 还有些设备根本没有加速度计（老 iPad、部分台式机浏览器模拟移动端）。
    所以必须做降级——检测不到传感器时自动换成手动点击，保证任何设备都能玩。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>任务四 · 摇一摇彩蛋</title>
  <style>
    * { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
      overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff;
    }

    /* lyh_标题区 */
    .lyh-title { text-align: center; margin-bottom: 30px; }
    .lyh-title h1 { font-size: 26px; margin: 0 0 6px; }
    .lyh-title p { margin: 0; font-size: 14px; opacity: .85; }

    /* lyh_摇一摇大图标（纯 CSS 动画） */
    .lyh-shake-icon {
      font-size: 120px; line-height: 1;
      animation: lyh_float 2.5s ease-in-out infinite;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,.35));
    }
    @keyframes lyh_float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .lyh-shaking .lyh-shake-icon { animation: lyh_shake .35s ease; }
    @keyframes lyh_shake {
      0%,100%{transform:translate(0,0) rotate(0)}
      20%{transform:translate(-14px,0) rotate(-8deg)}
      40%{transform:translate(14px,0) rotate(8deg)}
      60%{transform:translate(-10px,0) rotate(-5deg)}
      80%{transform:translate(10px,0) rotate(5deg)}
    }

    /* lyh_状态提示 */
    .lyh-status {
      margin-top: 22px; padding: 10px 24px;
      background: rgba(255,255,255,.2); backdrop-filter: blur(6px);
      border-radius: 24px; font-size: 14px; text-align: center;
    }
    .lyh-status.ok { background: rgba(76,175,80,.85); }
    .lyh-status.err { background: rgba(244,67,54,.85); }

    /* lyh_降级按钮 */
    .lyh-btn {
      margin-top: 16px; padding: 12px 32px; font-size: 15px; font-weight: 600;
      background: #fff; color: #764ba2;
      border: none; border-radius: 28px; cursor: pointer;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
    }
    .lyh-btn.show { display: inline-block; }
    .lyh-btn:active { transform: scale(.96); }

    /* lyh_结果弹窗 */
    .lyh-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      display: none; align-items: center; justify-content: center; z-index: 200;
    }
    .lyh-overlay.show { display: flex; animation: lyh_fade .25s; }
    @keyframes lyh_fade { from{opacity:0} to{opacity:1} }

    .lyh-card {
      width: 80vw; max-width: 360px; background: #fff; border-radius: 20px; overflow: hidden;
      color: #333;
      transform: scale(.6); opacity: 0;
      animation: lyh_pop .45s cubic-bezier(.34,1.56,.64,1) forwards;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    @keyframes lyh_pop { to{transform:scale(1);opacity:1} }
    .lyh-card img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .lyh-card-body { padding: 16px 20px 20px; text-align: center; }
    .lyh-card-body h2 { margin: 0 0 6px; font-size: 20px; }
    .lyh-card-body p { margin: 0; font-size: 13px; color: #666; line-height: 1.6; }
    .lyh-card-body button {
      margin-top: 14px; padding: 8px 24px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: #fff; border: none; border-radius: 16px; font-size: 14px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="lyh-title">
    <h1>🎰 摇一摇抽今日菜谱</h1>
    <p>摇一摇手机，抽一道美食！</p>
  </div>

  <div class="lyh-shake-area" id="lyh_shakeArea">
    <div class="lyh-shake-icon" id="lyh_icon">📱</div>
  </div>

  <div class="lyh-status" id="lyh_status">🔍 正在检测传感器...</div>
  <button class="lyh-btn" id="lyh_btn">🔄 点我抽一次</button>

  <div class="lyh-overlay" id="lyh_overlay">
    <div class="lyh-card">
      <img id="lyh_img" src="" alt="" />
      <div class="lyh-card-body">
        <h2 id="lyh_name">—</h2>
        <p id="lyh_desc">—</p>
        <button onclick="lyh_close()">好嘞，就吃这个！</button>
      </div>
    </div>
  </div>

<script>
  // ══════════════════════════════════════════════════════════
  //  lyh_摇一摇彩蛋核心逻辑（严格按截图要求实现）
  // ══════════════════════════════════════════════════════════

  // lyh_菜谱数据（6 道菜 + AI 生成美食图）
  var LYH_MENUS = [
    { name: '🍲 番茄鸡蛋面',  desc: '快手早餐首选，酸甜开胃，10 分钟搞定。', img: 'mobile-imgs/tomato_egg_noodle.jpg' },
    { name: '🍛 红烧肉盖饭',  desc: '肥而不腻，入口即化，一顿两碗没问题。',   img: 'mobile-imgs/dongpo_pork.jpg' },
    { name: '🍜 兰州牛肉面',  desc: '一清二白三红四绿五黄，地道西北味。',       img: 'mobile-imgs/lanzhou_noodle.jpg' },
    { name: '🌶️ 麻婆豆腐盖饭', desc: '麻辣鲜香，嫩滑入味，配米饭绝了。',      img: 'mobile-imgs/mapo_tofu.jpg' },
    { name: '🐟 清蒸鲈鱼饭',  desc: '肉质细嫩，蒸鱼豉油一滴鲜过一滴。',        img: 'mobile-imgs/steamed_bass.jpg' },
    { name: '🦆 北京烤鸭套餐', desc: '皮脆肉嫩，卷荷叶饼蘸甜面酱，国宴级。',   img: 'mobile-imgs/beijing_duck.jpg' },
  ];

  // lyh_变量（严格按截图：阈值约 18，冷却 1.5s）
  var LYH_THRESHOLD = 18;      // lyh_阈值：合成加速度 > 18 判定为摇动（约 1.8g）
  var LYH_COOLDOWN = 1500;    // lyh_冷却：1.5 秒内不重复触发
  var lyh_isCooling = false;

  var lyh_status = document.getElementById('lyh_status');
  var lyh_btn = document.getElementById('lyh_btn');
  var lyh_icon = document.getElementById('lyh_icon');
  var lyh_shakeArea = document.getElementById('lyh_shakeArea');

  // ══════════════════════════════════════════════════════════
  //  lyh_验收②：降级处理 —— 当前设备不支持 → 显示手动按钮
  // ══════════════════════════════════════════════════════════
  function lyh_fallback() {
    lyh_status.textContent = '⚠️ 当前设备不支持加速度传感器，请用手机打开';
    lyh_status.className = 'lyh-status err';
    lyh_btn.textContent = '🔄 点我抽一次';
    lyh_btn.classList.add('show');
    lyh_btn.onclick = lyh_shakeTrigger;
  }

  // ══════════════════════════════════════════════════════════
  //  lyh_1. 检测 DeviceMotion API 是否存在
  // ══════════════════════════════════════════════════════════
  if (!('DeviceMotionEvent' in window)) {
    lyh_fallback();
  } else {
    // lyh_验收③：iOS 13+ 必须通过按钮申请权限（不能自动弹）
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      lyh_status.textContent = '📲 iOS 需要授权，请点下方按钮开启传感器';
      lyh_status.className = 'lyh-status';
      lyh_btn.textContent = '🔑 开启传感器授权';
      lyh_btn.classList.add('show');
      lyh_btn.onclick = function () {
        DeviceMotionEvent.requestPermission().then(function (res) {
          if (res === 'granted') {
            lyh_btn.classList.remove('show');
            lyh_status.textContent = '✅ 授权成功，摇一摇手机抽菜谱！';
            lyh_status.className = 'lyh-status ok';
            lyh_startListen();
          } else {
            lyh_fallback();
          }
        }).catch(function () { lyh_fallback(); });
      };
    } else {
      // lyh_Android / 其他浏览器 → 直接启动监听
      lyh_status.textContent = '✅ 传感器就绪，摇一摇手机抽菜谱！';
      lyh_status.className = 'lyh-status ok';
      lyh_startListen();
    }
  }

  // ══════════════════════════════════════════════════════════
  //  lyh_2. 监听 devicemotion — 验收④：取 accelerationIncludingGravity
  // ══════════════════════════════════════════════════════════
  // ⚠️ accelerationIncludingGravity vs acceleration 的区别（答辩用）：
  //   accelerationIncludingGravity → **含重力加速度** (9.8 m/s²)
  //     手机静止平放时，z 轴 ≈ -9.8，合成 mag ≈ 9.8
  //     好处：无论手机怎么放，静止值稳定在 ~9.8，摇动时 mag > 18 明显区分
  //
  //   acceleration → **去除重力后的真实运动加速度**
  //     手机静止时 mag ≈ 0（理想状态）
  //     问题：不是所有设备都支持此字段（部分旧 Android / iOS 版本缺失）
  //
  //   选择 accelerationIncludingGravity 的原因：
  //     1) 兼容性更好（所有支持 DeviceMotion 的设备都有此字段）
  //     2) 阈值 18 远大于静止时的 ~9.8，能清晰区分"静止"和"摇动"
  function lyh_startListen() {
    var lyh_gotData = false;

    window.addEventListener('devicemotion', function (e) {
      // lyh_优先取 accelerationIncludingGravity，兼容旧设备再回退 acceleration
      var acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc) return;  // lyh_两种都没有 → 这条事件没用

      lyh_gotData = true;

      // lyh_合成加速度：mag = sqrt(x² + y² + z²)
      var mag = Math.sqrt(
        (acc.x || 0) * (acc.x || 0) +
        (acc.y || 0) * (acc.y || 0) +
        (acc.z || 0) * (acc.z || 0)
      );

      // lyh_验收①：超过阈值 + 不在冷却中 → 触发（保证一次摇动只触发一次）
      if (!lyh_isCooling && mag > LYH_THRESHOLD) {
        lyh_shakeTrigger();
      }
    });

    // lyh_3 秒内没收到任何数据 → HTTP 环境被静默屏蔽了 → 降级
    setTimeout(function () {
      if (!lyh_gotData) lyh_fallback();
    }, 3000);

    // lyh_图标也能点（手机上直接点图标也能玩）
    lyh_icon.style.cursor = 'pointer';
    lyh_icon.addEventListener('click', lyh_shakeTrigger);
  }

  // ══════════════════════════════════════════════════════════
  //  lyh_3. 触发摇一摇（有冷却）
  // ══════════════════════════════════════════════════════════
  function lyh_shakeTrigger() {
    if (lyh_isCooling) return;

    // lyh_触觉反馈：如果设备支持震动 API（iOS 不支持也不会报错）
    if ('vibrate' in navigator) {
      try { navigator.vibrate([80, 50, 80]); } catch (e) {}
    }

    // lyh_视觉反馈：图标剧烈抖动
    lyh_shakeArea.classList.add('lyh-shaking');
    lyh_status.textContent = '🎲 摇动中！抽取今日菜谱...';
    lyh_status.className = 'lyh-status';

    // lyh_验收①：触发后进入 1.5 秒冷却
    lyh_isCooling = true;

    // lyh_0.4 秒后弹出菜谱动画
    setTimeout(function () {
      lyh_shakeArea.classList.remove('lyh-shaking');
      lyh_pick();
    }, 400);

    // lyh_冷却结束后解锁
    setTimeout(function () {
      lyh_isCooling = false;
      lyh_status.textContent = '✅ 摇一摇手机抽新菜谱！';
      lyh_status.className = 'lyh-status ok';
    }, LYH_COOLDOWN);
  }

  // ══════════════════════════════════════════════════════════
  //  lyh_4. 随机抽一道菜 + 弹出动画
  // ══════════════════════════════════════════════════════════
  function lyh_pick() {
    var m = LYH_MENUS[Math.floor(Math.random() * LYH_MENUS.length)];
    document.getElementById('lyh_img').src = m.img;
    document.getElementById('lyh_name').textContent = m.name;
    document.getElementById('lyh_desc').textContent = m.desc;
    document.getElementById('lyh_overlay').classList.add('show');
  }

  function lyh_close() {
    document.getElementById('lyh_overlay').classList.remove('show');
  }
  document.getElementById('lyh_overlay').addEventListener('click', function (e) {
    if (e.target === this) lyh_close();
  });
</script>
</body>
</html>
