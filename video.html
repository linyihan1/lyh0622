  命名约定：所有 CSS 类 / HTML id / JS 变量函数 均以 lyh_ 开头
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>课堂演示视频</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f0f1a; color: #fff;
      display: flex; flex-direction: column;
    }

    .lyh-header {
      padding: 16px 20px; text-align: center;
      background: linear-gradient(90deg, #667eea, #764ba2);
    }
    .lyh-header h1 { font-size: 20px; margin: 0; }
    .lyh-header p { margin: 4px 0 0; font-size: 12px; opacity: .85; }

    /* lyh_视频容器：16:9 自适应 */
    .lyh-video-wrap {
      position: relative;
      width: 100%; padding-bottom: 56.25%; /* 16:9 */
      background: #000;
    }
    .lyh-video-wrap video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
    }

    .lyh-info {
      flex: 1; padding: 20px; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .lyh-info p { font-size: 14px; opacity: .8; line-height: 1.7; }
    .lyh-info a {
      display: inline-block; margin-top: 14px; padding: 10px 24px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: #fff; text-decoration: none; border-radius: 20px; font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="lyh-header">
    <h1>🎬 课堂演示视频</h1>
    <p>林奕含 · 24002120622</p>
  </div>

  <!-- lyh_视频播放器：autoplay 自动播 · muted 静音 · loop 循环 · playsinline iOS 兼容 -->
  <div class="lyh-video-wrap">
    <video id="lyh_video" controls autoplay muted loop playsinline preload="metadata">
      <source src="video.mp4" type="video/mp4" />
      您的浏览器不支持 video 标签
    </video>
  </div>

  <div class="lyh-info">
    <p>视频无法自动播放？点一下播放器上的 ▶️ 按钮手动播放</p>
    <a href="index.html">← 返回首页</a>
  </div>

</body>
</html>
